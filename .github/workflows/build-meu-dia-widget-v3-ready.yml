name: Build Meu Dia Widget APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Write source chunk 1/11
        run: printf '%s' '' >> source.b64
      - name: Write source chunk 2/11
        run: printf '%s' '' >> source.b64
      - name: Write source chunk 3/11
        run: printf '%s' '' >> source.b64
      - name: Write source chunk 4/11
        run: printf '%s' '' >> source.b64
      - name: Write source chunk 5/11
        run: printf '%s' '' >> source.b64
      - name: Write source chunk 6/11
        run: printf '%s' '' >> source.b64
      - name: Write source chunk 7/11
        run: printf '%s' '' >> source.b64
      - name: Write source chunk 8/11
        run: printf '%s' '' >> source.b64
      - name: Write source chunk 9/11
        run: printf '%s' '' >> source.b64
      - name: Write source chunk 10/11
        run: printf '%s' '' >> source.b64
      - name: Write source chunk 11/11
        run: printf '%s' '' >> source.b64
      - name: Recreate Android project
        shell: bash
        run: |
          base64 -d source.b64 > source.zip
          unzip -q source.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: meu-dia-android-widget
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MeuDiaWidget-debug
          path: meu-dia-android-widget/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
