name: Build Meu Dia Widget APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'meu-dia-widget-source-v4.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android source
        shell: bash
        run: |
          test -f meu-dia-widget-source-v4.zip
          rm -rf meu-dia-widget-v4-src
          unzip -q meu-dia-widget-source-v4.zip
          test -f meu-dia-widget-v4-src/settings.gradle
          test -f meu-dia-widget-v4-src/app/build.gradle

      - name: Show tool versions
        shell: bash
        run: |
          java -version
          gradle --version

      - name: Build debug APK
        working-directory: meu-dia-widget-v4-src
        shell: bash
        run: |
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          test -s meu-dia-widget-v4-src/app/build/outputs/apk/debug/app-debug.apk
          ls -lh meu-dia-widget-v4-src/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MeuDiaWidget-debug
          path: meu-dia-widget-v4-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
